name: PR

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Install pinned scriptc
        run: npm install -g scriptc@0.0.36
      - name: REST static coverage
        run: node scripts/static-coverage.mjs
